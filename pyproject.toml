[project]
name = "sc-nodes"
version = "0.1.1"
description = "A nonoha-engine plugin for SuperCollider (sclang) process management with audio routing support."
readme = "README.md"
authors = [{name = "VIE, Inc."}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["nonoha", "dataflow", "node-graph", "supercollider", "sclang", "audio", "pipewire"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.urls]
Homepage   = "https://github.com/viestyle-dev/sc-nodes"
Repository = "https://github.com/viestyle-dev/sc-nodes"
Issues     = "https://github.com/viestyle-dev/sc-nodes/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nonoha-core @ git+https://github.com/viestyle-dev/nonoha-core.git",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["sc_nodes"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.nonoha-hub]
engine-compatibility = [">=0.9.0", "<0.11.0"]
